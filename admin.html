<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Portfolio CMS</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="index.html" target="_blank" rel="noopener">Elias<span>.</span><small>CONTENT STUDIO</small></a>
    <nav id="sectionNav" aria-label="CMS sections">
      <button data-section="site" class="active">Site settings</button>
      <button data-section="hero">Hero &amp; intro</button>
      <button data-section="story">Story</button>
      <button data-section="focus">Skills &amp; focus</button>
      <button data-section="projects">Projects</button>
      <button data-section="experience">Experience</button>
      <button data-section="direction">Direction</button>
      <button data-section="proof">Proof &amp; CV</button>
      <button data-section="contact">Contact &amp; links</button>
      <button data-section="publish">Publish to GitHub</button>
    </nav>
    <div class="side-note"><b>NO-CODE CMS</b><p>Edit content in this dashboard. Nothing here asks you to edit HTML, CSS, or JavaScript.</p></div>
  </aside>
  <main class="cms-main">
    <header class="cms-header"><div><span class="eyebrow">Portfolio content manager</span><h1 id="sectionTitle">Site settings</h1></div><div class="header-actions"><a class="secondary-btn" href="index.html" target="_blank" rel="noopener">View site ↗</a><button class="primary-btn" id="saveDraft">Save local draft</button></div></header>
    <div class="notice" id="notice" role="status" aria-live="polite"></div>
    <section class="cms-content" id="cmsContent"></section>
  </main>
  <input id="importInput" type="file" accept="application/json,.json" hidden>
  <script src="content.js"></script><script src="admin.js"></script>
</body>
</html>
